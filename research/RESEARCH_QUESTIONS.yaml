## IV. Research Landscape & Gap Analysis

### A. Disciplinary Fragmentation

**RQ4.1: How fragmented is discourse around wisdom/AW/sapience?**
- Do psychology, philosophy, and AI talk past each other?
- Quantify: citation networks, shared terminology, conceptual overlap
- Which concepts are bridges vs. isolated silos?

**RQ4.2: Which scholars, papers, and traits act as "bridges"?**
- Papers citing both psychological wisdom scales AND AI architectures
- Authors publishing across disciplines
- Traits discussed in multiple domains (e.g., metacognition)
- Graph centrality metrics to identify connectors

**RQ4.3: Are there "invisible colleges" in AI wisdom research?**
- Clusters of researchers unaware of parallel work
- Geographic, institutional, or paradigmatic boundaries
- Opportunities for synthesis and collaboration

**RQ4.4: What are the citation patterns between human wisdom science and AI?**
- Do AI papers cite psychological wisdom research?
- Do psychologists engage with AI implementations?
- Temporal analysis: is integration increasing or decreasing?

### B. Conceptual Gaps & Inconsistencies

**RQ4.5: Can GraphRAG improve definitional clarity?**
- Retrieve passages anchoring each concept to domain-specific usage
- Identify where "wisdom" means different things in different papers
- Generate disambiguated definitions via citation clustering

**RQ4.6: Can knowledge graph quantify conceptual similarity?**
- Graph distance between "Artificial Wisdom", "Machine Phronesis", "Sapience"
- Shared trait overlap, co-citation, definitional alignment
- Are these synonyms, subtypes, or distinct constructs?

**RQ4.7: Which wisdom traits are theorized but never operationalized?**
- Psychological constructs with no AI implementations
- "Compassion", "emotional regulation", "prosocial orientation"—largely missing?
- Identify low-hanging fruit for AI wisdom research

**RQ4.8: Which AI capabilities are unnamed in wisdom literature?**
- Architectures exhibiting wisdom-like behavior without the label
- Inverse problem: find AI systems that should be called "wise"
- Opportunities for cross-disciplinary recognition

**RQ4.9: What are the major theoretical conflicts or contradictions?**
- Does anyone claim wisdom requires consciousness while others deny it?
- Conflicting definitions of "intelligence" vs. "wisdom"
- Unresolved debates that GraphRAG can surface

