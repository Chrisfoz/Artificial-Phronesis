## XI. Example Usage with GraphRAG

### Sample Queries to Run

```python
# RQ4.5: Improve definitional clarity
result = hybrid_rag.query_with_context(
    "How is 'Artificial Wisdom' defined across different papers? Identify variations and commonalities.",
    concepts=["Artificial Wisdom"]
)

# RQ4.7: Find unimplemented traits
gaps = hybrid_rag.find_implementation_gaps("Artificial Wisdom")

# RQ1.1: Compare constructs
comparison = hybrid_rag.compare_concepts("Wisdom", "Intelligence")

# RQ4.2: Identify bridge scholars
# (requires Neo4j query)
query = """
MATCH (p1:Paper)-[:DISCUSSES]->(c1:Concept)
WHERE c1.domain CONTAINS 'psychology'
WITH p1
MATCH (p1)-[:DISCUSSES]->(c2:Concept)
WHERE c2.domain CONTAINS 'AI'
MATCH (a:Author)-[:AUTHORED]->(p1)
RETURN a.name, count(p1) as bridge_papers
ORDER BY bridge_papers DESC
"""

# RQ2.1: Which AI systems implement which traits
query = """
MATCH (arch:Architecture)-[:IMPLEMENTS_ASPECT_OF]->(t:Trait)
RETURN arch.name, collect(t.name) as traits
ORDER BY size(traits) DESC
"""
```

